name: Zeyad Abdelrahim
tagline: AI Researcher
career-objective: Research Engineer specializing in Reinforcement Learning (RL) and Large Language Models (LLMs) with a focus on post-training techniques (SFT, GRPO, LoRA) and multimodal foundation models. Experienced in building agentic LLM systems capable of reasoning, planning, and tool-use. Published researcher with a proven track record in developing scalable AI systems and deploying models to production using Python, C++, and CUDA. Passionate about advancing intelligent, interactive AI experiences bridging language, vision, and action.
